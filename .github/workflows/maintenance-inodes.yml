name: maintenance-inodes

# SiteGround inode audit and safe cleanup for WorxEvents only.
# NEVER touches other sites under ~/www.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: report counts only, or clean then report
        type: choice
        required: true
        options:
          - report
          - cleanup
        default: report

concurrency:
  group: worxevents-maintenance-inodes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inodes:
    name: Inode ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mask connection secrets
        env:
          SG_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_USER: ${{ secrets.SG_SSH_USER }}
          SG_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "${SG_HOST}" ]; then echo "::add-mask::${SG_HOST}"; fi
          if [ -n "${SG_USER}" ]; then echo "::add-mask::${SG_USER}"; fi
          if [ -n "${SG_PORT}" ]; then echo "::add-mask::${SG_PORT}"; fi
          if [ -n "${SG_SSH_PASSPHRASE}" ]; then echo "::add-mask::${SG_SSH_PASSPHRASE}"; fi

      - name: Require SiteGround connection secrets
        env:
          SG_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_USER: ${{ secrets.SG_SSH_USER }}
          SG_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${SG_HOST}" ]]; then echo "missing_secret=SG_SSH_HOST"; missing=1; fi
          if [[ -z "${SG_USER}" ]]; then echo "missing_secret=SG_SSH_USER"; missing=1; fi
          if [[ -z "${SG_PORT}" ]]; then echo "missing_secret=SG_SSH_PORT"; missing=1; fi
          if [[ -z "${SG_SSH_KEY}" ]]; then echo "missing_secret=SG_SSH_KEY"; missing=1; fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the missing GitHub Actions secrets on mymediaworx/worxevents."
            exit 1
          fi

      - name: Run ${{ inputs.mode }} on SiteGround (WorxEvents only)
        env:
          SG_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_USER: ${{ secrets.SG_SSH_USER }}
          SG_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          chmod +x scripts/ssh-siteground.sh scripts/prepare-siteground-ssh.sh scripts/inode-maintenance.sh
          close_ssh() {
            timeout 15 scripts/ssh-siteground.sh -O exit "${SG_USER}@${SG_HOST}" >/dev/null 2>&1 || true
          }
          trap close_ssh EXIT
          {
            echo "## WorxEvents inode ${MODE}"
            echo
            echo '```'
            scripts/ssh-siteground.sh "${SG_USER}@${SG_HOST}" "MODE=$(printf %q "$MODE") bash -s" < scripts/inode-maintenance.sh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
